<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — BST Kontrol Paneli</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/theme.js"></script>
</head>
<body>
 <nav class="navbar">
  <div class="navbar-brand">
    <div class="logo">BST</div>
    <span>Kontrol Paneli</span>
<nav class="navbar">
    <div class="navbar-brand">
      <div class="logo">BST</div>
      <span>Kontrol Paneli</span>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menü">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <div class="navbar-links" id="navbarLinks">
      <a href="admin.html" class="active"><span class="label">Dashboard</span></a>
      <a href="admin-talepler.html"><span class="label">Talepler</span></a>
      <a href="admin-siniflar.html"><span class="label">Sınıflar</span></a>
      <a href="admin-kullanicilar.html" class="superadmin-only hidden"><span class="label">Kullanıcılar</span></a>
      <a href="admin-adminler.html" class="superadmin-only hidden"><span class="label">Adminler</span></a>
      <a href="admin-arsiv.html"><span class="label">Arşiv</span></a>
      <a href="#" id="themeBtn"><span class="label">Tema</span></a>
      <a href="#" id="logoutBtn"><span class="label">Çıkış</span></a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 id="greeting">Dashboard</h1>
      <p>BST/IT teknik destek sistemine genel bakış.</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Bekleyen</div>
        <div class="stat-value red" id="statPending">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">İşlemde</div>
        <div class="stat-value" id="statInProgress">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Bugün Çözülen</div>
        <div class="stat-value" id="statCompleted">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Toplam Aktif</div>
        <div class="stat-value" id="statActive">-</div>
      </div>
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:14px;">
        <h2 style="margin:0;">Bekleyen Talepler</h2>
        <a href="admin-talepler.html" class="btn btn-sm">Tümünü Gör</a>
      </div>
      <div id="pendingList"><p class="muted">Yükleniyor...</p></div>
    </div>
  </div>

  <script type="module">
    import { apiFetch, getUser, clearTokens } from './js/api.js';
    import { icons, statusLabels, formatDate, esc, toast } from './js/ui.js';

    const user = getUser();
    if (!user) window.location.href = 'login.html';
    else if (user.role !== 'admin' && user.role !== 'superadmin') {
      window.location.href = 'dashboard.html';
    } else {
      const label = user.role === 'superadmin' ? 'Ana Admin' : 'IT Admin';
      document.getElementById('greeting').textContent = `Merhaba, ${user.name} (${label})`;
      if (user.role === 'superadmin') {
        document.querySelectorAll('.superadmin-only').forEach(el => el.classList.remove('hidden'));
      }
    }

    document.getElementById('themeBtn').addEventListener('click', (e) => {
      e.preventDefault(); window.toggleTheme();
    });
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault(); clearTokens(); window.location.href = 'login.html';
    });
// Hamburger menü
const menuToggle = document.getElementById('menuToggle');
const navbarLinks = document.getElementById('navbarLinks');
if (menuToggle && navbarLinks) {
  menuToggle.addEventListener('click', () => {
    navbarLinks.classList.toggle('open');
  });
  // Menü linkine tıklayınca menüyü kapat
  navbarLinks.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => navbarLinks.classList.remove('open'));
  });
}
    function renderTicket(t) {
      return `
        <div class="ticket ${t.status}">
          <div class="ticket-head">
            <div>
              <div class="ticket-id">${esc(t.ticketNumber)}</div>
              <div class="ticket-title">${esc(t.problemType?.name || t.customProblem || 'Sorun')}</div>
            </div>
            <span class="badge badge-${t.status}">${statusLabels[t.status]}</span>
          </div>
          <div class="ticket-meta">
            <span>${icons.building} ${esc(t.room?.roomCode || '-')}</span>
            <span>${formatDate(t.createdAt)}</span>
            <span>${esc(t.user?.name || '')} ${esc(t.user?.surname || '')}</span>
          </div>
        </div>
      `;
    }

    async function load() {
      try {
        const [stats, pending] = await Promise.all([
          apiFetch('/tickets/stats'),
          apiFetch('/tickets?status=pending'),
        ]);
        document.getElementById('statPending').textContent = stats.pending;
        document.getElementById('statInProgress').textContent = stats.inProgress;
        document.getElementById('statCompleted').textContent = stats.completedToday;
        document.getElementById('statActive').textContent = stats.totalActive;

        const list = document.getElementById('pendingList');
        const tickets = pending.tickets.slice(0, 8);
        list.innerHTML = tickets.length
          ? tickets.map(renderTicket).join('')
          : `<div class="empty">${icons.empty}<p>Bekleyen talep yok.</p></div>`;
      } catch (e) {
        toast(e.message, 'error');
      }
    }
    load();
  </script>
</body>
</html>
