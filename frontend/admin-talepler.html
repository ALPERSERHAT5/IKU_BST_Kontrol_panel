<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talepler — BST Kontrol Paneli</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/theme.js"></script>
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand">
      <div class="logo">BST</div>
      <span>Kontrol Paneli</span>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menü">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <div class="navbar-links" id="navbarLinks">
      <a href="admin.html"><span class="label">Dashboard</span></a>
      <a href="admin-talepler.html" class="active"><span class="label">Talepler</span></a>
      <a href="admin-siniflar.html"><span class="label">Sınıflar</span></a>
      <a href="admin-kullanicilar.html" class="superadmin-only hidden"><span class="label">Kullanıcılar</span></a>
      <a href="admin-adminler.html" class="superadmin-only hidden"><span class="label">Adminler</span></a>
      <a href="admin-arsiv.html"><span class="label">Arşiv</span></a>
      <a href="#" id="themeBtn"><span class="label">Tema</span></a>
      <a href="#" id="logoutBtn"><span class="label">Çıkış</span></a>
    </div>
  </nav>
  

  <div class="container">
    <div class="page-header">
      <h1>Destek Talepleri</h1>
      <p>Gelen tüm teknik destek taleplerini görüntüleyin ve yönetin.</p>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-status="all">Tümü</button>
      <button class="filter-btn" data-status="pending">Bekleyen</button>
      <button class="filter-btn" data-status="in_progress">İşlemde</button>
      <button class="filter-btn" data-status="completed">Tamamlandı</button>
    </div>

    <div class="search-bar">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Talep ID, sınıf veya sorun ara..." />
    </div>

    <div id="list"><p class="muted">Yükleniyor...</p></div>
  </div>

  <script type="module">
    import { apiFetch, getUser, clearTokens } from './js/api.js';
    import { icons, statusLabels, formatDate, esc, toast, openModal } from './js/ui.js';

    const user = getUser();
    if (!user) window.location.href = 'login.html';
    else if (user.role !== 'admin' && user.role !== 'superadmin') {
      window.location.href = 'dashboard.html';
    } else if (user.role === 'superadmin') {
      document.querySelectorAll('.superadmin-only').forEach(el => el.classList.remove('hidden'));
    }

    document.getElementById('themeBtn').addEventListener('click', (e) => {
      e.preventDefault(); window.toggleTheme();
    });
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault(); clearTokens(); window.location.href = 'login.html';
    });

    // Hamburger menü
const menuToggle = document.getElementById('menuToggle');
const navbarLinks = document.getElementById('navbarLinks');
if (menuToggle && navbarLinks) {
  menuToggle.addEventListener('click', () => {
    navbarLinks.classList.toggle('open');
  });
  // Menü linkine tıklayınca menüyü kapat
  navbarLinks.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => navbarLinks.classList.remove('open'));
  });
}
    let currentStatus = 'all';
    let searchQuery = '';

    function renderTicket(t) {
      const canAssign = t.status === 'pending';
      const canComplete = t.status === 'in_progress' && t.assignedAdminId === user.id;
      const assignedByMe = t.status === 'in_progress' && t.assignedAdminId === user.id;
      const assignedByOther = t.status === 'in_progress' && t.assignedAdminId !== user.id;

      return `
        <div class="ticket ${t.status}">
          <div class="ticket-head">
            <div>
              <div class="ticket-id">${esc(t.ticketNumber)}</div>
              <div class="ticket-title">${esc(t.problemType?.name || t.customProblem || 'Sorun')}</div>
            </div>
            <span class="badge badge-${t.status}">${statusLabels[t.status]}</span>
          </div>
          <div class="ticket-meta">
            <span>${icons.building} ${esc(t.room?.roomCode || '-')}</span>
            <span>${formatDate(t.createdAt)}</span>
            <span>Talep sahibi: ${esc(t.user?.name || '')} ${esc(t.user?.surname || '')}</span>
          </div>
          ${t.description ? `<div class="ticket-desc">${esc(t.description)}</div>` : ''}
          ${assignedByOther ? `<div class="ticket-assigned">Bu görev ${esc(t.assignedAdmin.name)} ${esc(t.assignedAdmin.surname)} tarafından alındı.</div>` : ''}
          ${assignedByMe ? `<div class="ticket-assigned" style="color:var(--red); font-weight:500;">Bu görev üzerinizde.</div>` : ''}
          ${t.status === 'completed' && t.solution ? `<div class="ticket-desc" style="border-left-color:var(--red);"><strong>Çözüm:</strong> ${esc(t.solution)}</div>` : ''}
          <div class="ticket-actions">
            ${canAssign ? `<button class="btn btn-sm btn-primary" data-action="assign" data-id="${t.id}">${icons.play} Görevi Al</button>` : ''}
            ${canComplete ? `<button class="btn btn-sm btn-primary" data-action="complete" data-id="${t.id}">${icons.check} Görevi Tamamla</button>` : ''}
            ${(user.role === 'superadmin' && t.status !== 'completed' && t.status !== 'cancelled') ? `<button class="btn btn-sm" data-action="cancel" data-id="${t.id}">İptal Et</button>` : ''}
          </div>
        </div>
      `;
    }

    async function load() {
      try {
        const params = new URLSearchParams();
        if (currentStatus !== 'all') params.set('status', currentStatus);
        if (searchQuery) params.set('search', searchQuery);
        const { tickets } = await apiFetch(`/tickets?${params.toString()}`);
        const list = document.getElementById('list');
        list.innerHTML = tickets.length
          ? tickets.map(renderTicket).join('')
          : `<div class="empty">${icons.empty}<p>Bu kriterlere uygun talep yok.</p></div>`;

        list.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', () => handleAction(btn.dataset.action, btn.dataset.id));
        });
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function handleAction(action, id) {
      try {
        if (action === 'assign') {
          await apiFetch(`/tickets/${id}/assign`, { method: 'POST' });
          toast('Görev üzerinize alındı.', 'success');
          load();
        } else if (action === 'complete') {
          openCompleteModal(id);
        } else if (action === 'cancel') {
          if (!confirm('Bu talebi iptal etmek istediğinize emin misiniz?')) return;
          await apiFetch(`/tickets/${id}/cancel`, { method: 'POST' });
          toast('Talep iptal edildi.', 'success');
          load();
        }
      } catch (e) {
        toast(e.message, 'error');
        load();
      }
    }

    function openCompleteModal(id) {
      const form = document.createElement('form');
      form.innerHTML = `
        <div class="form-group">
          <label>Çözüm Açıklaması (isteğe bağlı)</label>
          <textarea id="solutionText" placeholder="Örn: HDMI kablosu değiştirildi."></textarea>
        </div>
        <div class="modal-foot" style="padding:0; border:none; margin-top:8px;">
          <button type="button" class="btn" data-close>Vazgeç</button>
          <button type="submit" class="btn btn-primary">${icons.check} Tamamla</button>
        </div>
      `;
      const modal = openModal({ title: 'Görevi Tamamla', body: form });
      form.querySelector('[data-close]').addEventListener('click', modal.close);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await apiFetch(`/tickets/${id}/complete`, {
            method: 'POST',
            body: JSON.stringify({ solution: form.querySelector('#solutionText').value.trim() || null }),
          });
          toast('Görev tamamlandı.', 'success');
          modal.close();
          load();
        } catch (err) {
          toast(err.message, 'error');
        }
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStatus = btn.dataset.status;
        load();
      });
    });

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = e.target.value.trim();
        load();
      }, 300);
    });

    load();
  </script>
</body>
</html>
