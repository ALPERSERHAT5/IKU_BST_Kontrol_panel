<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sınıflar — BST Kontrol Paneli</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <div class="logo">BST</div>
      <span>Kontrol Paneli</span>
    </div>
    <div class="navbar-links">
      <a href="admin.html"><span class="label">Dashboard</span></a>
      <a href="admin-talepler.html"><span class="label">Talepler</span></a>
      <a href="admin-siniflar.html" class="active"><span class="label">Sınıflar</span></a>
      <a href="admin-kullanicilar.html" class="superadmin-only hidden"><span class="label">Kullanıcılar</span></a>
      <a href="admin-adminler.html" class="superadmin-only hidden"><span class="label">Adminler</span></a>
      <a href="admin-arsiv.html"><span class="label">Arşiv</span></a>
      <a href="#" id="themeBtn"><span class="label">Tema</span></a>
      <a href="#" id="logoutBtn"><span class="label">Çıkış</span></a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header row-between">
      <div>
        <h1>Sınıflar</h1>
        <p>Sınıf kayıtları ve QR kodları.</p>
      </div>
      <button class="btn btn-primary superadmin-only hidden" id="addRoomBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
        Yeni Sınıf Ekle
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Sınıf Kodu</th>
            <th>Kat</th>
            <th>Koridor</th>
            <th>Oda</th>
            <th class="text-right">İşlem</th>
          </tr>
        </thead>
        <tbody id="roomTable"><tr><td colspan="5"><p class="muted">Yükleniyor...</p></td></tr></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { apiFetch, getUser, clearTokens } from './js/api.js';
    import { icons, esc, toast, openModal } from './js/ui.js';

    const user = getUser();
    if (!user) window.location.href = 'login.html';
    else if (user.role !== 'admin' && user.role !== 'superadmin') {
      window.location.href = 'dashboard.html';
    } else if (user.role === 'superadmin') {
      document.querySelectorAll('.superadmin-only').forEach(el => el.classList.remove('hidden'));
    }

    document.getElementById('themeBtn').addEventListener('click', (e) => {
      e.preventDefault(); window.toggleTheme();
    });
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault(); clearTokens(); window.location.href = 'login.html';
    });

    async function load() {
      try {
        const { rooms } = await apiFetch('/rooms');
        const tbody = document.getElementById('roomTable');
        if (!rooms.length) {
          tbody.innerHTML = `<tr><td colspan="5"><div class="empty">${icons.empty}<p>Kayıtlı sınıf yok.</p></div></td></tr>`;
          return;
        }
        tbody.innerHTML = rooms.map(r => `
          <tr>
            <td><strong>${esc(r.roomCode)}</strong></td>
            <td>${r.floor}</td>
            <td>${esc(r.corridor)}</td>
            <td>${esc(r.roomNumber)}</td>
            <td class="text-right">
              <button class="btn btn-sm" data-qr="${r.id}">${icons.qr} QR</button>
              ${user.role === 'superadmin' ? `<button class="btn btn-sm" data-del="${r.id}">Sil</button>` : ''}
            </td>
          </tr>
        `).join('');

        tbody.querySelectorAll('[data-qr]').forEach(btn => {
          btn.addEventListener('click', () => showQr(btn.dataset.qr));
        });
        tbody.querySelectorAll('[data-del]').forEach(btn => {
          btn.addEventListener('click', () => removeRoom(btn.dataset.del));
        });
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function showQr(id) {
      try {
        const { dataUrl, room } = await apiFetch(`/rooms/${id}/qr`);
        const body = document.createElement('div');
        body.innerHTML = `
          <div class="qr-box">
            <img src="${dataUrl}" alt="QR" />
            <div class="qr-label">${esc(room.roomCode)}</div>
            <div class="qr-sub">BST Teknik Destek</div>
          </div>
          <p class="muted" style="text-align:center; margin-top:12px; font-size:13px;">
            Bu QR kodu yazdırıp sınıf kapısına yapıştırabilirsiniz.
          </p>
          <div class="modal-foot" style="padding:0; border:none;">
            <button class="btn" onclick="window.print()">${icons.print} Yazdır</button>
          </div>
        `;
        openModal({ title: `QR Kod — ${room.roomCode}`, body });
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function removeRoom(id) {
      if (!confirm('Bu sınıfı silmek istediğinize emin misiniz?')) return;
      try {
        await apiFetch(`/rooms/${id}`, { method: 'DELETE' });
        toast('Sınıf silindi.', 'success');
        load();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    document.getElementById('addRoomBtn')?.addEventListener('click', () => {
      const form = document.createElement('form');
      form.innerHTML = `
        <div class="form-group">
          <label>Sınıf Kodu <span class="req">*</span></label>
          <input id="roomCode" placeholder="Örn: 4C-12-13" required />
          <div class="form-hint">Format: [Kat][Koridor]-[Oda] — örn: 4C-12-13</div>
        </div>
        <div class="row" style="gap:12px;">
          <div class="form-group" style="flex:1;">
            <label>Kat <span class="req">*</span></label>
            <input id="floor" type="number" min="0" placeholder="4" required />
          </div>
          <div class="form-group" style="flex:1;">
            <label>Koridor <span class="req">*</span></label>
            <input id="corridor" placeholder="C" required />
          </div>
          <div class="form-group" style="flex:1;">
            <label>Oda <span class="req">*</span></label>
            <input id="roomNumber" placeholder="12-13" required />
          </div>
        </div>
        <div class="modal-foot" style="padding:0; border:none;">
          <button type="button" class="btn" data-close>Vazgeç</button>
          <button type="submit" class="btn btn-primary">Kaydet</button>
        </div>
      `;
      const modal = openModal({ title: 'Yeni Sınıf Ekle', body: form });
      form.querySelector('[data-close]').addEventListener('click', modal.close);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await apiFetch('/rooms', {
            method: 'POST',
            body: JSON.stringify({
              roomCode: form.querySelector('#roomCode').value.trim(),
              floor: form.querySelector('#floor').value,
              corridor: form.querySelector('#corridor').value.trim(),
              roomNumber: form.querySelector('#roomNumber').value.trim(),
            }),
          });
          toast('Sınıf eklendi.', 'success');
          modal.close();
          load();
        } catch (err) {
          toast(err.message, 'error');
        }
      });
    });

    load();
  </script>
</body>
</html>
